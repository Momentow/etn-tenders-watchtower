[project]
name = "watchtower"
version = "0.1.0"
description = "Autonomous procurement-portal reader: attach, notice, repair."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "selectolax",
    "lxml",
    "jsonpath-ng",
    "playwright==1.65.2",  # must match the Dockerfile base image tag
    "aiosqlite",
    "openai-agents",
    "jinja2",
    "pydantic",
    "cssselect>=1.6.0",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio"]
docs = ["zensical==0.1.1"]  # docs site build (T-019); runs in its own Docker stage

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower", "mockportals"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
